<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 520px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #333;
    }
    #tabCount {
      color: #666;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .options {
      margin-bottom: 10px;
      display: flex;
      gap: 15px;
    }
    .options label {
      font-size: 12px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    #tabList {
      width: 100%;
      height: 300px;
      font-family: monospace;
      font-size: 11px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 8px;
      resize: vertical;
      white-space: pre;
    }
    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    #copyBtn {
      background: #4285f4;
      color: white;
    }
    #copyBtn:hover {
      background: #3367d6;
    }
    #downloadBtn {
      background: #34a853;
      color: white;
    }
    #downloadBtn:hover {
      background: #2d8e47;
    }
    #refreshBtn {
      background: #666;
      color: white;
    }
    #refreshBtn:hover {
      background: #555;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #34a853;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h2>Tabstr</h2>
  <div id="tabCount"></div>
  <div class="options">
    <label>
      <input type="checkbox" id="showTitles"> Show tab titles
    </label>
    <label>
      <input type="checkbox" id="groupWindows"> Group by window
    </label>
  </div>
  <textarea id="tabList" readonly></textarea>
  <div class="buttons">
    <button id="copyBtn">Copy to Clipboard</button>
    <button id="downloadBtn">Download .txt</button>
    <button id="refreshBtn">Refresh</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
